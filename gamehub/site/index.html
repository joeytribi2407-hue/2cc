<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub - Chơi game</title>
<style>
:root{--bg:#0f1220;--card:#1a1e33;--card2:#222744;--text:#eef0ff;--muted:#9aa0c3;--accent:#7c5cff;--accent2:#00d4b4;--danger:#ff5c7a;--ok:#2ecc8f;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#262b55 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;position:sticky;top:0;background:rgba(15,18,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid #2a3055;z-index:10}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}
.logo span{color:var(--accent2)}
.spacer{flex:1}
.btn{display:inline-block;border:0;cursor:pointer;padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid #3a4175;color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.small{padding:6px 11px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:24px}
h1,h2{margin:0 0 14px}
.flash{padding:11px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.flash.ok{background:rgba(46,204,143,.15);border:1px solid var(--ok)}
.flash.err{background:rgba(255,92,122,.15);border:1px solid var(--danger)}
input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #333a6b;background:#12152a;color:var(--text);font:inherit}
textarea{min-height:160px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
label{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted)}
.panel{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:22px;border:1px solid #2a3055}
.muted{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.45);color:#cfc6ff;white-space:nowrap}
</style>

<style>
.hero{margin:6px 0 18px}
.hero h1{font-size:32px}
.hero p{color:var(--muted);margin:0}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{max-width:320px}
.toolbar select{padding:10px 12px;border-radius:10px;border:1px solid #333a6b;background:#12152a;color:var(--text);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid #3a4175;background:transparent;color:var(--text);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip small{opacity:.7;margin-left:4px}
.count{color:var(--muted);font-size:13px;margin:0 0 14px}

/* 3 game mỗi hàng */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid #2a3055;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(124,92,255,.25)}
/* Ảnh intro tỉ lệ 16:9 */
.banner{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.ori{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.head{display:flex;gap:12px;align-items:flex-end;padding:0 16px;margin-top:-30px;position:relative}
/* Logo vuông 1:1 */
.glogo{flex:none;width:62px;height:62px;border-radius:14px;border:3px solid var(--card);background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;overflow:hidden}
.glogo img{width:100%;height:100%;object-fit:cover;display:block}
.head h3{margin:0 0 3px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbody{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
</style>

</head>
<body>
<header>
  <a class="logo" href="/">🎮 Game<span>Hub</span></a>
  <div class="spacer"></div>
  
</header>
<main>
  
    
  
  
<div class="hero">
  <h1>Chọn game và chơi ngay</h1>
  <p>Không cần đăng nhập, bấm vào game là chơi.</p>
</div>


<div class="toolbar">
  <input id="q" type="search" placeholder="Tìm game theo tên...">
  <select id="sort" aria-label="Sắp xếp">
    <option value="new">Mới nhất</option>
    
    <option value="az">Tên A → Z</option>
  </select>
  <select id="ori" aria-label="Hướng chơi">
    <option value="">Mọi hướng chơi</option>
    <option value="landscape">↔ Chơi ngang</option>
    <option value="portrait">↕ Chơi dọc</option>
  </select>
</div>

<div class="chips" id="chips">
  <button class="chip on" data-g="">Tất cả<small>1</small></button>
  <button class="chip" data-g="Phiêu lưu">Phiêu lưu<small>1</small></button><button class="chip" data-g="Đua xe">Đua xe<small>1</small></button><button class="chip" data-g="Trẻ em">Trẻ em<small>1</small></button>
</div>

<p class="count" id="count"></p>

<div class="grid" id="grid">
  
  <a class="card" href="/play/01456bce/"
     data-t="vua đỗ xe hẻm nhỏ (alleyway ninja)" data-g="Phiêu lưu,Đua xe,Trẻ em" data-p="3" data-d="2026-11-04T11:07:18" data-o="landscape">
    <div class="banner">
      <span class="ori">↔ Ngang</span>
      <img src="/img/07b884de7a784843.png" alt="" loading="lazy">
    </div>
    <div class="head">
      <div class="glogo"><img src="/img/5858f0eb60a04041.png" alt="" loading="lazy"></div>
      <h3 title="Vua Đỗ Xe Hẻm Nhỏ (Alleyway Ninja)">Vua Đỗ Xe Hẻm Nhỏ (Alleyway Ninja)</h3>
    </div>
    <div class="cbody">
      
      <div class="tags"><span class="tag">Phiêu lưu</span><span class="tag">Đua xe</span><span class="tag">Trẻ em</span></div>
      <p>Mỗi 10m có 1 bất ngờ</p>
      <div class="meta"><span></span><span class="btn small">Chơi</span></div>
    </div>
  </a>
  
</div>
<div class="empty" id="none" hidden>Không có game nào phù hợp bộ lọc.</div>


<script>
(function(){
  var grid=document.getElementById('grid'); if(!grid) return;
  var q=document.getElementById('q'), sortSel=document.getElementById('sort'), oriSel=document.getElementById('ori'),
      chips=document.getElementById('chips'), count=document.getElementById('count'),
      none=document.getElementById('none'), genre='';
  var cards=[].slice.call(grid.querySelectorAll('.card'));
  function apply(){
    var v=q.value.trim().toLowerCase(), n=0, s=sortSel.value;
    cards.sort(function(a,b){
      if(s==='hot') return (b.dataset.p-a.dataset.p)||(a.dataset.d<b.dataset.d?1:-1);
      if(s==='az') return a.dataset.t.localeCompare(b.dataset.t,'vi');
      return a.dataset.d<b.dataset.d?1:-1;
    });
    cards.forEach(function(c){
      grid.appendChild(c);
      var okG=!genre||(','+c.dataset.g+',').indexOf(','+genre+',')>-1;
      var okT=!v||c.dataset.t.indexOf(v)>-1;
      var okO=!oriSel.value||c.dataset.o===oriSel.value;
      c.style.display=(okG&&okT&&okO)?'':'none'; if(okG&&okT&&okO)n++;
    });
    count.textContent='Hiển thị '+n+' / '+cards.length+' game';
    none.hidden=n>0;
  }
  q.addEventListener('input',apply); sortSel.addEventListener('change',apply); oriSel.addEventListener('change',apply);
  if(chips) chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    [].forEach.call(chips.children,function(x){x.classList.remove('on')});
    b.classList.add('on'); genre=b.dataset.g; apply();
  });
  apply();
})();
</script>

</main>
</body>
</html>
